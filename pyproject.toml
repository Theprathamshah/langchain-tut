[project]
name = "langchain-tut"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pratham Shah", email = "itspratham2911@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.8.1",
    "langchain-google-genai>=4.5.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-tut = "langchain_tut:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
]
